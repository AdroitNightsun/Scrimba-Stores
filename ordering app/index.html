<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1 class="main-heading">Jimmy's Diner</h1>
      <h2 class="secondary-heading">The best burgers and pizzas in town.</h2>
    </header>
    <main>
      <div class="menu-container" id="menu-container">
        <!-- menu here -->
      </div>
    </main>
    <footer class="order-section" id="order-section">
      <h2 class="order-heading">Your order</h2>
      <div class="order-container" id="order-container">
        <div class="order-items" id="order-items">
          <!-- order items here -->
        </div>
        
      </div>
      <button id="order-btn" class="complete-order">Complete order</button>
    </footer>
    <div class="modal-container" id="modal-container">
      <div class="modal-content">
        <h1 class="modal-heading">Enter Card Details</h1>
        <form id="modal-form" class="modal-form">
          <input type="text" placeholder="Enter your name" required id="name-input">
          <input type="text" placeholder="Enter card number" required>
          <input type="number" placeholder="Enter CVV" required>
          <input type="submit" class="modal-pay-btn" id="pay-btn" placeholder="Pay"> 
        </form>
        
      </div>
    </div>
    <script src="index.js" type="module"></script>
  </body>
</html>
